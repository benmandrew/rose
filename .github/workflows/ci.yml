name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  graph:
    name: Graph Build (${{ matrix.compiler }}, ${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        preset: [debug, release]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Nix
      uses: cachix/install-nix-action@v30
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
    - name: Cache Nix store
      uses: nix-community/cache-nix-action@v6
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
        gc-max-store-size-linux: 2G
        purge: true
        purge-prefixes: nix-${{ runner.os }}-
        purge-created: 0
        purge-primary-key: never
    - name: Select compiler
      # CMake reads CC/CXX from the environment on the first configure of a
      # build directory and bakes the choice into the cache, so the preset
      # itself stays compiler-agnostic.
      run: |
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          echo "CC=clang"   >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
        else
          echo "CC=gcc" >> "$GITHUB_ENV"
          echo "CXX=g++" >> "$GITHUB_ENV"
        fi
    - name: Cache CMake dependencies (FetchContent)
      uses: actions/cache@v4
      with:
        path: build/${{ matrix.preset }}/_deps
        key: ${{ runner.os }}-cmake-deps-${{ matrix.compiler }}-${{ matrix.preset }}-${{ github.repository }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-cmake-deps-${{ matrix.compiler }}-${{ matrix.preset }}-${{ github.repository }}-
    - name: Check clang-format
      run: |
        echo "Running clang-format --dry-run"
        git ls-files '*.cpp' '*.h' '*.hpp' | xargs -r nix develop -c clang-format -style=file -n
    - name: Reduce ASLR entropy for AddressSanitizer
      # Newer Ubuntu runners use high-entropy ASLR which can stop ASan from
      # mapping its shadow memory. Lowering mmap_rnd_bits keeps the Debug
      # preset's sanitizers usable. No-op for the Release preset.
      run: sudo sysctl -w vm.mmap_rnd_bits=28
    - name: Configure
      run: nix develop -c cmake --preset ${{ matrix.preset }}
    - name: Build
      run: nix develop -c cmake --build --preset ${{ matrix.preset }} -j
    - name: Run tests
      run: nix develop -c ctest --preset ${{ matrix.preset }}

  web:
    name: Web Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Nix
      uses: cachix/install-nix-action@v30
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
    - name: Cache Nix store
      uses: nix-community/cache-nix-action@v6
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
        gc-max-store-size-linux: 2G
        purge: true
        purge-prefixes: nix-${{ runner.os }}-
        purge-created: 0
        purge-primary-key: never
    - name: Cache npm
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-${{ github.repository }}-node-${{ hashFiles('web/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ github.repository }}-node-
    - name: Install web dependencies
      run: nix develop -c npm ci
      working-directory: web
    - name: Biome run lint
      run: nix develop -c npx biome lint
      working-directory: web
    - name: Biome check formatting
      run: nix develop -c npx biome format
      working-directory: web

  docker:
    name: Push Docker Images
    runs-on: ubuntu-latest
    needs: [graph, web]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push graph image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rose:graph
          file: docker/Dockerfile.graph
          context: .
      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rose:web
          file: docker/Dockerfile.web
          context: .
